/* ---------------------------------------------------------
   RYNOVA AI — single-file build, wired to a real Supabase
   project (REST + Auth API, no SDK / build step needed).
   Session lives in memory only — refreshing the page logs
   you out. Swap in supabase-js with persistSession for a
   full production deploy.
--------------------------------------------------------- */

const SUPABASE_URL = "https://quabufcifiushxpxudnf.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_lqVunSZ6hq86RQdJi1UwNA_xrXfZeDc";
const REST = `${SUPABASE_URL}/rest/v1`;
const AUTH = `${SUPABASE_URL}/auth/v1`;

function useSupabase() {
  const [session, setSession] = useState(null);

  const headers = (json = true) => {
    const h = { apikey: SUPABASE_ANON_KEY };
    h.Authorization = `Bearer ${session?.access_token || SUPABASE_ANON_KEY}`;
    if (json) h["Content-Type"] = "application/json";
    return h;
  };

  async function signUp(email, password) {
    const res = await fetch(`${AUTH}/signup`, {
      method: "POST",
      headers: headers(),
      body: JSON.stringify({ email, password }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data?.msg || data?.error_description || "Sign up failed");
    if (data.access_token) setSession({ access_token: data.access_token, user: data.user });
    return data;
  }

  async function signIn(email, password) {
    const res = await fetch(`${AUTH}/token?grant_type=password`, {
      method: "POST",
      headers: headers(),
      body: JSON.stringify({ email, password }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data?.error_description || data?.msg || "Login failed");
    setSession({ access_token: data.access_token, user: data.user });
    return data;
  }

  function signOut() {
    setSession(null);
  }

  return { session, headers, signUp, signIn, signOut };
}

/* ---------------- Match scoring (deterministic, not random) ---------------- */
function scoreTool(tool, query) {
  if (!query.trim()) return null;
  const q = query.toLowerCase();
  const terms = q.split(/\s+/).filter((t) => t.length > 2);
  if (terms.length === 0) return null;

  const haystacks = [
    { text: tool.name?.toLowerCase() || "", weight: 3 },
    { text: tool.short_description?.toLowerCase() || "", weight: 2 },
    { text: tool.long_description?.toLowerCase() || "", weight: 1 },
    { text: (tool.use_cases || []).join(" ").toLowerCase(), weight: 3 },
    { text: (tool.features || []).join(" ").toLowerCase(), weight: 2 },
    { text: tool.categories?.name?.toLowerCase() || "", weight: 2 },
    { text: tool.best_for?.toLowerCase() || "", weight: 2 },
  ];

  let hits = 0;
  const maxHits = terms.length * haystacks.reduce((a, h) => a + h.weight, 0);
  for (const term of terms) {
    for (const h of haystacks) {
      if (h.text.includes(term)) hits += h.weight;
    }
  }
  if (hits === 0) return null;
  const coverage = Math.min(1, hits / (maxHits * 0.25));
  const qualityBoost = (tool.rating / 5) * 0.15 + (tool.popularity_score / 100) * 0.1;
  const raw = coverage * 0.75 + qualityBoost;
  return Math.max(52, Math.min(99, Math.round(raw * 100)));
}

function reasonFor(tool, query) {
  const terms = query.toLowerCase().split(/\s+/).filter((t) => t.length > 2);
  const matchedUseCases = (tool.use_cases || []).filter((u) => terms.some((t) => u.toLowerCase().includes(t)));
  const matchedFeatures = (tool.features || []).filter((f) => terms.some((t) => f.toLowerCase().includes(t)));
  if (matchedUseCases.length) return `Matches your need for ${matchedUseCases.slice(0, 2).join(" and ").toLowerCase()}.`;
  if (matchedFeatures.length) return `Stands out for ${matchedFeatures.slice(0, 2).join(" and ").toLowerCase()}.`;
  return `Strong overall fit for this category.`;
}

function timeAgo(dateStr) {
  const diff = Date.now() - new Date(dateStr).getTime();
  const days = Math.floor(diff / 86400000);
  if (days <= 0) return "today";
  if (days === 1) return "1 day ago";
  if (days < 30) return `${days} days ago`;
  const months = Math.floor(days / 30);
  if (months < 12) return `${months} month${months===1?"":"s"} ago`;
  return `${Math.floor(months/12)} year${Math.floor(months/12)===1?"":"s"} ago`;
}

function ToolDetail({ tool, onClose, saved, onToggleSave, onOpenCollections, session, headers }) {
  const [reviews, setReviews] = useState([]);
  const [reviewsLoading, setReviewsLoading] = useState(true);
  const [myRating, setMyRating] = useState(0);
  const [myBody, setMyBody] = useState("");
  const [reviewError, setReviewError] = useState("");
  const [submitting, setSubmitting] = useState(false);
  const [helpfulClicked, setHelpfulClicked] = useState(new Set());

  useEffect(() => {
    if (!tool) return;
    async function load() {
      setReviewsLoading(true);
      try {
        const res = await fetch(`${REST}/reviews?select=*&tool_id=eq.${tool.id}&order=created_at.desc`, { headers: headers() });
        const data = await res.json();
        setReviews(data);
        if (session) {
          const mine = data.find((r) => r.user_id === session.user.id);
          if (mine) { setMyRating(mine.rating); setMyBody(mine.body || ""); }
          else { setMyRating(0); setMyBody(""); }
        }
      } catch {} finally { setReviewsLoading(false); }
    }
    load();
  }, [tool?.id]);

  async function submitReview() {
    if (!session) return;
    if (myRating < 1) { setReviewError("Pick a star rating first."); return; }
    setSubmitting(true); setReviewError("");
    try {
      const res = await fetch(`${REST}/reviews?on_conflict=user_id,tool_id`, {
        method: "POST",
        headers: { ...headers(), Prefer: "resolution=merge-duplicates,return=representation" },
        body: JSON.stringify({ user_id: session.user.id, tool_id: tool.id, rating: myRating, body: myBody.trim() || null }),
      });
      const data = await res.json();
      if (!res.ok) { setReviewError(data?.message || "Could not save review."); return; }
      setReviews((prev) => {
        const others = prev.filter((r) => r.user_id !== session.user.id);
        return [data[0], ...others];
      });
    } catch (err) {
      setReviewError(err.message || "Network error.");
    } finally { setSubmitting(false); }
  }

  async function markHelpful(review) {
    if (helpfulClicked.has(review.id)) return;
    setHelpfulClicked((prev) => new Set(prev).add(review.id));
    setReviews((prev) => prev.map((r) => r.id===review.id ? { ...r, helpful_count:(r.helpful_count||0)+1 } : r));
    try {
      await fetch(`${REST}/reviews?id=eq.${review.id}`, {
        method: "PATCH",
        headers: headers(),
        body: JSON.stringify({ helpful_count: (review.helpful_count||0)+1 }),
      });
    } catch {}
  }

  if (!tool) return null;
  const avgRating = reviews.length ? (reviews.reduce((a,r)=>a+r.rating,0)/reviews.length).toFixed(1) : tool.rating;
  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/60" onClick={onClose} style={{backdropFilter:"blur(4px)"}}>

          <div className="flex items-center gap-3">
            <Logo name={tool.name} size={40} />
            <div>
              <h2 className="font-semibold" style={{ color:C.text, fontFamily:"'Space Grotesk', sans-serif" }}>{tool.name}</h2>
              <p className="text-xs" style={{ color:C.faint }}>{tool.categories?.name}</p>
            </div>
          </div>
          <button onClick={onClose} className="p-2 rounded-full" style={{ color:C.sub }}><Icon.x size={18} /></button>
        </div>
        <div className="p-6 flex flex-col gap-6">
          <p className="leading-relaxed" style={{ color:C.sub }}>{tool.long_description || tool.short_description}</p>
          <div className="flex items-center gap-2 flex-wrap">
            <PricingPill type={tool.pricing_type} />
            <Pill>{tool.pricing_details}</Pill>
            <span className="flex items-center gap-1 text-xs" style={{ color:C.sub }}><Icon.star size={12} /> {tool.rating} ({(tool.review_count||0).toLocaleString()})</span>
          </div>
          <div className="grid sm:grid-cols-2 gap-6">
            <div>
              <h4 className="text-xs font-semibold uppercase tracking-wide mb-2" style={{ color:C.faint }}>Key features</h4>
              <ul className="space-y-1.5">
                {(tool.features||[]).map((f,i)=>(<li key={i} className="text-sm flex items-start gap-2" style={{ color:C.sub }}><span style={{color:C.violet, marginTop:2}}><Icon.check /></span> {f}</li>))}
              </ul>
            </div>
            <div>
              <h4 className="text-xs font-semibold uppercase tracking-wide mb-2" style={{ color:C.faint }}>Best for</h4>
              <p className="text-sm" style={{ color:C.sub }}>{tool.best_for}</p>
              <h4 className="text-xs font-semibold uppercase tracking-wide mt-4 mb-2" style={{ color:C.faint }}>Platforms</h4>

          <div className="grid sm:grid-cols-2 gap-6">

            </div>
            <div>

            </div>
          </div>

          <div style={{ borderTop:`1px solid ${C.cardBorder}`, paddingTop:20 }}>
            <div className="flex items-center justify-between mb-4">
              <h4 className="text-sm font-semibold" style={{ color:C.text }}>Reviews</h4>
              <span className="text-xs" style={{ color:C.faint }}>{reviews.length} review{reviews.length===1?"":"s"} · avg {avgRating}★</span>
            </div>

function AuthModal({ onClose, onSignIn, onSignUp }) {
  const [mode, setMode] = useState("signin");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);
  const [success, setSuccess] = useState("");

  async function submit(e) {
    e.preventDefault();
    setError(""); setSuccess("");
    if (!email.includes("@")) return setError("Enter a valid email address.");
    if (password.length < 6) return setError("Password must be at least 6 characters.");
    setLoading(true);
    try {
      if (mode === "signin") { await onSignIn(email, password); onClose(); }
      else {
        const data = await onSignUp(email, password);
        if (data?.access_token) onClose();
        else setSuccess("Account created — check your email to confirm before signing in.");
      }
    } catch (err) { setError(err.message); }
    finally { setLoading(false); }
  }

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-6" onClick={onClose} style={{backdropFilter:"blur(4px)"}}>
      <div className="w-full max-w-sm rounded-3xl p-6" style={{ background:C.card, border:`1px solid ${C.cardBorder}` }} onClick={(e)=>e.stopPropagation()}>
        <div className="flex items-center justify-between mb-6">
          <h2 className="font-semibold text-lg" style={{ color:C.text, fontFamily:"'Space Grotesk', sans-serif" }}>{mode === "signin" ? "Log in" : "Create account"}</h2>
          <button onClick={onClose} className="p-1.5 rounded-full" style={{ color:C.sub }}><Icon.x size={16} /></button>
        </div>
        <form onSubmit={submit} className="flex flex-col gap-3">
          <input type="email" placeholder="Email" value={email} onChange={(e)=>setEmail(e.target.value)} className="rounded-xl px-4 py-3 text-sm outline-none" style={{ background:"#0F0F16", border:`1px solid ${C.cardBorder}`, color:C.text }} />
          <input type="password" placeholder="Password" value={password} onChange={(e)=>setPassword(e.target.value)} className="rounded-xl px-4 py-3 text-sm outline-none" style={{ background:"#0F0F16", border:`1px solid ${C.cardBorder}`, color:C.text }} />
          {error && <p className="text-xs flex items-center gap-1.5" style={{ color:"#FB7185" }}><Icon.alert /> {error}</p>}
          {success && <p className="text-xs" style={{ color:"#34D399" }}>{success}</p>}
          <button type="submit" disabled={loading} className="text-sm font-medium py-3 rounded-xl flex items-center justify-center gap-2 disabled:opacity-60" style={{ background:C.violet, color:"white" }}>
            {loading ? "Please wait..." : (mode === "signin" ? "Log in" : "Sign up")}
          </button>
        </form>
        <p className="text-xs text-center mt-4" style={{ color:C.faint }}>
          {mode === "signin" ? "New to Rynova?" : "Already have an account?"}{" "}
          <button className="font-medium" style={{ color:"#A78BFA" }} onClick={()=>{ setMode(mode==="signin"?"signup":"signin"); setError(""); setSuccess(""); }}>
            {mode === "signin" ? "Create an account" : "Log in"}
          </button>
        </p>
      </div>
    </div>
  );
}

function IntroSequence({ tools, onDone }) {
  const [i, setI] = useState(0);
  const ready = tools.length >= 3;
  const toolFrames = ready ? tools.slice(0, 5) : [];
  const totalFrames = 1 + toolFrames.length + 1; // brand + tools + CTA

  useEffect(() => {
    if (!ready && i === 0) return; // hold on brand frame until data arrives
    const duration = i === 0 ? 4600 : 2000;
    const t = setTimeout(() => {
      if (i + 1 >= totalFrames) onDone();
      else setI(i + 1);
    }, duration);
    return () => clearTimeout(t);
  }, [i, ready, totalFrames]);

  const isBrand = i === 0;
  const isCTA = i === totalFrames - 1 && i > 0;
  const tool = !isBrand && !isCTA ? toolFrames[i - 1] : null;
  const toolAccents = ["#8B5CF6", "#F5D485", "#60A5FA", "#F472B6", "#34D399"];

  return (
    <div className="fixed inset-0 z-[100] flex flex-col items-center justify-center px-8 overflow-hidden" style={{ background: "radial-gradient(circle at 50% 40%, #17121F 0%, #0A0A0F 70%)" }}>
      <div key={i} style={{ animation: "fadeSlideIn 0.5s ease-out" }} className="flex flex-col items-center text-center max-w-xs">
        {isBrand && (

          </React.Fragment>
        )}
        {tool && (
          <React.Fragment>
            <div className="relative flex items-center justify-center mb-2" style={{ width:110, height:110 }}>
              <div className="absolute inset-0 rounded-full" style={{ background:`radial-gradient(circle, ${accent}55 0%, transparent 70%)`, animation:"pulseGlow 1.8s ease-in-out infinite" }} />

                <Logo name={tool.name} size={76} />

            <p className="text-sm leading-relaxed" style={{ color:C.sub, opacity:0, animation:"letterIn 0.5s ease-out 0.35s forwards" }}>✨ {tool.short_description}</p>
          </React.Fragment>

function RynovaApp() {
  const { session, headers, signUp, signIn, signOut } = useSupabase();
  const [categories, setCategories] = useState([]);
  const [tools, setTools] = useState([]);
  const [savedIds, setSavedIds] = useState(new Set());
  const [collections, setCollections] = useState([]);
  const [dashboardTab, setDashboardTab] = useState("saved");
  const [openCollectionId, setOpenCollectionId] = useState(null);
  const [newCollectionName, setNewCollectionName] = useState("");
  const [pickerTool, setPickerTool] = useState(null);
  const [collectionError, setCollectionError] = useState("");
  const [compareIds, setCompareIds] = useState([]);
  const [showIntro, setShowIntro] = useState(true);
  const [menuOpen, setMenuOpen] = useState(false);
  const [selectedWorkflowId, setSelectedWorkflowId] = useState(null);
  const [loading, setLoading] = useState(true);
  const [loadError, setLoadError] = useState("");
  const [query, setQuery] = useState("");
  const [submittedQuery, setSubmittedQuery] = useState("");
  const [pricingTab, setPricingTab] = useState("all");
  const [view, setView] = useState("home");
  const [selectedTool, setSelectedTool] = useState(null);
  const [authOpen, setAuthOpen] = useState(false);
  const [recentIds, setRecentIds] = useState([]);

  useEffect(() => {
    window.history.replaceState({ view: "home", modal: null }, "");
    function onPop(e) {
      const s = e.state || { view: "home", modal: null };
      setView(s.view || "home");
      setSelectedTool(s.modal === "tool" ? (tools.find(t => t.id === s.toolId) || null) : null);
      setAuthOpen(s.modal === "auth");
    }
    window.addEventListener("popstate", onPop);
    return () => window.removeEventListener("popstate", onPop);
  }, [tools]);

  function goTo(nextView) {
    window.history.pushState({ view: nextView, modal: null }, "");
    setView(nextView);
  }
  function openAuth() {
    window.history.pushState({ view, modal: "auth" }, "");
    setAuthOpen(true);
  }
  function closeAuth() { window.history.back(); }
  function closeTool() { window.history.back(); }

  function toggleCompare(tool) {
    setCompareIds((prev) => {
      if (prev.includes(tool.id)) return prev.filter((id) => id !== tool.id);
      if (prev.length >= 3) return prev;
      return [...prev, tool.id];
    });
  }

  useEffect(() => {
    async function load() {
      setLoading(true); setLoadError("");
      try {
        const [catRes, toolRes] = await Promise.all([
          fetch(`${REST}/categories?select=*&order=name.asc`, { headers: headers() }),
          fetch(`${REST}/tools?select=*,categories(name,slug,icon)&status=eq.approved`, { headers: headers() }),
        ]);
        if (!catRes.ok || !toolRes.ok) throw new Error("Could not load data from Supabase.");
        setCategories(await catRes.json());
        const rawTools = await toolRes.json();
        const deduped = Array.from(new Map(rawTools.map(t => [t.name.trim().toLowerCase(), t])).values());
        setTools(deduped);
      } catch (err) { setLoadError(err.message); }
      finally { setLoading(false); }
    }
    load();
  }, []);

  useEffect(() => {
    async function loadSaved() {
      if (!session) return setSavedIds(new Set());
      try {
        const res = await fetch(`${REST}/saved_tools?select=tool_id&user_id=eq.${session.user.id}`, { headers: headers() });
        const data = await res.json();
        setSavedIds(new Set(data.map((d) => d.tool_id)));
      } catch {}
    }
    loadSaved();
    loadCollections();
  }, [session]);

  async function loadCollections() {
    if (!session) return setCollections([]);
    try {
      const res = await fetch(`${REST}/collections?select=*,collection_tools(tool_id,note)&user_id=eq.${session.user.id}&order=created_at.asc`, { headers: headers() });
      const data = await res.json();
      setCollections(data);
    } catch {}
  }

  async function createCollection(name) {
    if (!session || !name.trim()) return;
    setCollectionError("");
    try {
      const res = await fetch(`${REST}/collections`, {
        method: "POST",
        headers: { ...headers(), Prefer: "return=representation" },
        body: JSON.stringify({ user_id: session.user.id, name: name.trim() }),
      });
      const data = await res.json();
      if (!res.ok) {
        setCollectionError(data?.message || data?.hint || "Could not create collection.");
        return;
      }
      setCollections((prev) => [...prev, { ...data[0], collection_tools: [] }]);
      setNewCollectionName("");
    } catch (err) {
      setCollectionError(err.message || "Network error while creating collection.");
    }
  }

  async function deleteCollection(id) {
    setCollections((prev) => prev.filter((c) => c.id !== id));
    if (openCollectionId === id) setOpenCollectionId(null);
    try {
      await fetch(`${REST}/collections?id=eq.${id}`, { method: "DELETE", headers: headers() });
    } catch {}
  }

  async function updateCollectionNote(collectionId, toolId, note) {
    setCollections((prev) => prev.map((c) => {
      if (c.id !== collectionId) return c;
      return { ...c, collection_tools: c.collection_tools.map((ct) => ct.tool_id === toolId ? { ...ct, note } : ct) };
    }));
    try {
      await fetch(`${REST}/collection_tools?collection_id=eq.${collectionId}&tool_id=eq.${toolId}`, {
        method: "PATCH",
        headers: headers(),
        body: JSON.stringify({ note }),
      });
    } catch {}
  }

  async function toggleInCollection(collectionId, toolId) {
    const col = collections.find((c) => c.id === collectionId);
    const isIn = col?.collection_tools?.some((ct) => ct.tool_id === toolId);
    setCollections((prev) => prev.map((c) => {
      if (c.id !== collectionId) return c;
      return {
        ...c,
        collection_tools: isIn
          ? c.collection_tools.filter((ct) => ct.tool_id !== toolId)
          : [...c.collection_tools, { tool_id: toolId }],
      };
    }));
    try {
      if (isIn) {
        await fetch(`${REST}/collection_tools?collection_id=eq.${collectionId}&tool_id=eq.${toolId}`, { method: "DELETE", headers: headers() });
      } else {
        await fetch(`${REST}/collection_tools`, {
          method: "POST",
          headers: { ...headers(), Prefer: "return=minimal" },
          body: JSON.stringify({ collection_id: collectionId, tool_id: toolId }),
        });
      }
    } catch {}
  }

  async function toggleSave(tool) {
    if (!session) return openAuth();
    const isSaved = savedIds.has(tool.id);
    const next = new Set(savedIds);
    try {
      if (isSaved) {
        next.delete(tool.id); setSavedIds(next);
        await fetch(`${REST}/saved_tools?user_id=eq.${session.user.id}&tool_id=eq.${tool.id}`, { method:"DELETE", headers: headers() });
      } else {
        next.add(tool.id); setSavedIds(next);
        await fetch(`${REST}/saved_tools`, { method:"POST", headers:{...headers(), Prefer:"return=minimal"}, body: JSON.stringify({ user_id: session.user.id, tool_id: tool.id }) });
      }
    } catch { setSavedIds(savedIds); }
  }

  function openTool(tool) {
    window.history.pushState({ view, modal: "tool", toolId: tool.id }, "");
    setSelectedTool(tool);
    setRecentIds((prev) => [tool.id, ...prev.filter((id) => id !== tool.id)].slice(0,5));
  }

  async function runSearch(q) {
    setSubmittedQuery(q); goTo("discover");
    if (session && q.trim()) {
      try { await fetch(`${REST}/search_history`, { method:"POST", headers:{...headers(), Prefer:"return=minimal"}, body: JSON.stringify({ user_id: session.user.id, query: q }) }); } catch {}
    }
  }

  const featuredTool = useMemo(() => [...tools].sort((a,b)=>b.popularity_score-a.popularity_score)[0], [tools]);
  const categoryCounts = useMemo(() => { const m={}; tools.forEach(t=>{ const s=t.categories?.slug; if(s) m[s]=(m[s]||0)+1; }); return m; }, [tools]);
  const trendingList = useMemo(() => { let l = tools.filter(t=>t.trending||t.popularity_score>=85); if(pricingTab!=="all") l=l.filter(t=>t.pricing_type===pricingTab); return l.sort((a,b)=>b.popularity_score-a.popularity_score); }, [tools, pricingTab]);
  const newReleases = useMemo(() => {
    const unique = Array.from(new Map(tools.map(t => [t.id, t])).values());
    return unique.sort((a,b) => {
      const diff = new Date(b.created_at) - new Date(a.created_at);
      return diff !== 0 ? diff : a.name.localeCompare(b.name);
    }).slice(0,5);

  const recentTools = useMemo(() => recentIds.map(id=>tools.find(t=>t.id===id)).filter(Boolean), [recentIds, tools]);
  const searchResults = useMemo(() => { if(!submittedQuery.trim()) return []; return tools.map(t=>({...t,_score:scoreTool(t,submittedQuery)})).filter(t=>t._score!==null).sort((a,b)=>b._score-a._score); }, [tools, submittedQuery]);

      {showIntro && <IntroSequence tools={tools} onDone={() => setShowIntro(false)} />}
    <div className="min-h-screen" style={{ background:C.bg, color:C.text, fontFamily:"'Inter', sans-serif" }}>
      <nav className="sticky top-0 z-40" style={{ background:"rgba(10,10,15,0.9)", borderBottom:`1px solid ${C.cardBorder}` }}>
        <div className="max-w-3xl mx-auto px-5 h-16 flex items-center justify-between">
          <button onClick={()=>setMenuOpen(true)} className="flex items-center gap-2">
            <LuxeLogoMark size={30} />
            <span className="font-semibold text-lg tracking-tight" style={{ backgroundImage:"linear-gradient(100deg, #C4B5FD 0%, #F5D485 25%, #FFFFFF 40%, #F5D485 55%, #A78BFA 75%, #C4B5FD 100%)", backgroundSize:"250% 100%", WebkitBackgroundClip:"text", backgroundClip:"text", WebkitTextFillColor:"transparent", color:"transparent", animation:"shine 5s linear infinite", fontFamily:"'Space Grotesk', sans-serif" }}>Rynova</span>
          </button>
          {session ? (
            <button onClick={signOut} className="text-sm font-medium px-4 py-2 rounded-full" style={{ border:`1px solid ${C.cardBorder}`, color:C.text }}>Log out</button>
          ) : (
            <button onClick={openAuth} className="text-sm font-medium px-4 py-2 rounded-full flex items-center gap-1.5" style={{ background:C.violet, color:"white" }}><Icon.login /> Log in</button>
          )}
        </div>
      </nav>

      {menuOpen && (

          <div className="w-72 max-w-[80%] h-full p-5 flex flex-col" style={{ background:C.card, borderRight:`1px solid ${C.cardBorder}` }} onClick={(e)=>e.stopPropagation()}>
            <div className="flex items-center justify-between mb-6">
              <div className="flex items-center gap-2">
                <LuxeLogoMark size={26} />
                <span className="font-semibold" style={{ color:C.text, fontFamily:"'Space Grotesk', sans-serif" }}>Rynova</span>
              </div>
              <button onClick={()=>setMenuOpen(false)} style={{ color:C.sub }}><Icon.x size={18} /></button>
            </div>
            {session && <p className="text-xs mb-4 truncate" style={{ color:C.faint }}>{session.user.email}</p>}
            <div className="flex flex-col gap-1">
              <button onClick={()=>{setMenuOpen(false); goTo("dashboard"); setDashboardTab("saved");}} className="text-left text-sm font-medium px-3 py-3 rounded-xl" style={{ color:C.text }}>Saved Tools</button>
              <button onClick={()=>{setMenuOpen(false); goTo("dashboard"); setDashboardTab("collections");}} className="text-left text-sm font-medium px-3 py-3 rounded-xl" style={{ color:C.text }}>Collections</button>

              </div>
              <div className="flex flex-col gap-3">
                {newReleases.map(t=>(<ToolRow key={t.id} tool={t} query="" saved={savedIds.has(t.id)} onToggleSave={toggleSave} onOpen={openTool} comparing={compareIds.includes(t.id)} onToggleCompare={toggleCompare} />))}

            <section className="pt-8">
              <button onClick={()=>goTo("home")} className="text-xs mb-4 block" style={{ color:C.faint }}>← Back to home</button>
              <p className="text-sm" style={{ color:C.faint }}>Workflow not found.</p>
            </section>
          );
          return (
            <section className="pt-8">
              <button onClick={()=>goTo("home")} className="text-xs mb-4 block" style={{ color:C.faint }}>← Back to home</button>
              <span className="text-4xl">{wf.emoji}</span>
              <h1 className="text-2xl font-semibold mt-3 mb-1" style={{ color:C.text, fontFamily:"'Space Grotesk', sans-serif" }}>{wf.title}</h1>
              <p className="text-sm mb-6" style={{ color:C.faint }}>{wf.description}</p>
              <div className="flex flex-col">
                {wf.steps.map((step, idx) => {
                  const stepTool = tools.find(t => t.slug === step.toolSlug);
                  return (
                    <div key={idx} className="flex gap-3">
                      <div className="flex flex-col items-center">
                        <div className="w-8 h-8 rounded-full flex items-center justify-center text-xs font-semibold shrink-0" style={{ background:C.violet, color:"white" }}>{idx+1}</div>
                        {idx < wf.steps.length - 1 && <div className="w-px flex-1 my-1" style={{ background:C.cardBorder, minHeight:24 }} />}
                      </div>
                      <div className="pb-6 flex-1 min-w-0">
                        <p className="text-sm font-semibold" style={{ color:C.text }}>{step.title}</p>
                        <p className="text-xs mb-3" style={{ color:C.faint }}>{step.description}</p>
                        {stepTool ? (
                          <div className="rounded-xl p-3 flex items-center gap-3" style={{ background:C.card, border:`1px solid ${C.cardBorder}` }}>
                            <Logo name={stepTool.name} size={36} />
                            <div className="min-w-0 flex-1">
                              <p className="text-sm font-medium truncate" style={{ color:C.text }}>{stepTool.name}</p>
                              <p className="text-xs" style={{ color:C.faint }}>{stepTool.categories?.name}</p>
                            </div>
                            <button onClick={()=>openTool(stepTool)} className="text-xs font-medium px-3 py-1.5 rounded-full shrink-0" style={{ background:C.violet, color:"white" }}>View</button>
                          </div>
                        ) : (
                          <p className="text-xs" style={{ color:C.faint }}>Recommended tool loading…</p>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>
            </section>
          );
        })()}

        {view === "compare" && (
          <section className="pt-8">
            <button onClick={()=>goTo("home")} className="text-xs mb-4 block" style={{ color:C.faint }}>← Back to home</button>
            <h1 className="text-2xl font-semibold mb-1" style={{ color:C.text, fontFamily:"'Space Grotesk', sans-serif" }}>Compare tools</h1>
            <p className="text-sm mb-6" style={{ color:C.faint }}>{compareIds.length} of 3 selected</p>
            {(() => {
              const compareTools = compareIds.map(id => tools.find(t => t.id === id)).filter(Boolean);
              if (compareTools.length === 0) {
                return (
                  <div className="text-center py-16">
                    <p className="font-medium mb-1" style={{ color:C.text }}>No tools selected yet.</p>
                    <p className="text-sm" style={{ color:C.faint }}>Tap the compare icon on any tool to add it here.</p>
                  </div>
                );
              }
              const highestRated = compareTools.reduce((a,b) => (b.rating > a.rating ? b : a), compareTools[0]);
              const mostAffordable = compareTools.find(t => t.pricing_type === "free") || compareTools.find(t => t.has_free_plan) || [...compareTools].sort((a,b)=>a.pricing_type.localeCompare(b.pricing_type))[0];
              const easiest = compareTools.find(t => t.skill_level === "beginner") || compareTools[0];
              const badgesFor = (t) => {
                const b = [];
                if (t.id === highestRated.id) b.push({ label:"🏆 Highest rated", color:"#FBBF24" });
                if (t.id === mostAffordable.id) b.push({ label:"💰 Most affordable", color:"#34D399" });
                if (t.id === easiest.id) b.push({ label:"🌱 Easiest to start", color:"#60A5FA" });
                return b;
              };
              const rows = [
                { label: "Pricing", render: (t) => <PricingPill type={t.pricing_type} /> },
                { label: "Price details", render: (t) => <span style={{color:C.sub}}>{t.pricing_details}</span> },
                { label: "Free plan", render: (t) => <span style={{color: t.has_free_plan ? "#34D399" : "#FB7185"}}>{t.has_free_plan ? "Yes" : "No"}</span> },
                { label: "Rating", render: (t) => <span className="flex items-center gap-1" style={{color:C.text}}><Icon.star size={12} /> {t.rating} <span style={{color:C.faint}}>({(t.review_count||0).toLocaleString()})</span></span> },
                { label: "Skill level", render: (t) => <span style={{color:C.sub, textTransform:"capitalize"}}>{t.skill_level}</span> },
                { label: "Platforms", render: (t) => <span style={{color:C.sub}}>{(t.platforms||[]).join(", ")}</span> },
                { label: "Key features", render: (t) => <ul>{(t.features||[]).slice(0,4).map((f,i)=>(<li key={i} className="text-xs mb-1" style={{color:C.sub}}>• {f}</li>))}</ul> },
                { label: "Strengths", render: (t) => <ul>{(t.pros||[]).map((p,i)=>(<li key={i} className="text-xs mb-1" style={{color:"#34D399"}}>+ {p}</li>))}</ul> },
                { label: "Limitations", render: (t) => <ul>{(t.cons||[]).map((c,i)=>(<li key={i} className="text-xs mb-1" style={{color:"#FB7185"}}>− {c}</li>))}</ul> },
                { label: "Best for", render: (t) => <span style={{color:C.sub}}>{t.best_for}</span> },
              ];
              return (
                <React.Fragment>
                {compareTools.length > 1 && (
                  <div className="rounded-2xl p-4 mb-5" style={{ background:C.violetSoft, border:`1px solid ${C.violet}` }}>
                    <p className="text-xs font-semibold uppercase tracking-wide mb-2" style={{ color:"#C4B5FD" }}>Rynova's take</p>
                    <p className="text-sm leading-relaxed" style={{ color:C.text }}>
                      <b>{highestRated.name}</b> has the highest rating ({highestRated.rating}★).{" "}
                      <b>{mostAffordable.name}</b> is the most affordable{mostAffordable.has_free_plan ? " (free plan available)" : ""}.{" "}
                      {easiest.id !== highestRated.id && easiest.id !== mostAffordable.id && <React.Fragment><b>{easiest.name}</b> is easiest if you're just starting out.</React.Fragment>}
                    </p>
                  </div>
                )}
                <div className="overflow-x-auto -mx-5 px-5">
                  <div style={{ minWidth: compareTools.length * 200 }}>
                    <div className="flex gap-3 mb-3">
                      {compareTools.map((t) => (
                        <div key={t.id} className="flex-1 min-w-[180px] rounded-2xl p-3" style={{ background:C.card, border:`1px solid ${C.cardBorder}` }}>
                          <div className="flex items-center gap-2 mb-2">
                            <Logo name={t.name} size={32} />
                            <div className="min-w-0 flex-1">
                              <p className="text-sm font-semibold truncate" style={{ color:C.text }}>{t.name}</p>
                            </div>
                            <button onClick={()=>toggleCompare(t)} style={{color:C.faint}}><Icon.x size={14} /></button>
                          </div>
                          <div className="flex flex-col gap-1">
                            {badgesFor(t).map((b,bi) => (
                              <span key={bi} className="text-[10px] font-medium" style={{ color: b.color }}>{b.label}</span>
                            ))}
                          </div>
                        </div>
                      ))}
                    </div>
                    {rows.map((row, i) => (
                      <div key={i} className="flex gap-3 mb-3">
                        {compareTools.map((t) => (
                          <div key={t.id} className="flex-1 min-w-[180px] rounded-xl p-3" style={{ background:C.card, border:`1px solid ${C.cardBorder}` }}>
                            <p className="text-[10px] font-semibold uppercase tracking-wide mb-1.5" style={{ color:C.faint }}>{row.label}</p>
                            {row.render(t)}
                          </div>
                        ))}
                      </div>
                    ))}
                  </div>
                </div>
                </React.Fragment>
              );
            })()}
          </section>
        )}
      </div>

      {compareIds.length > 0 && view !== "compare" && (
        <div className="fixed bottom-4 left-1/2 -translate-x-1/2 z-40 flex items-center gap-3 rounded-full px-4 py-3 shadow-lg" style={{ background:C.card, border:`1px solid ${C.violet}` }}>
          <span className="text-xs font-medium" style={{ color:C.text }}>{compareIds.length} tool{compareIds.length===1?"":"s"} selected</span>
          <button onClick={()=>goTo("compare")} className="text-xs font-semibold px-3 py-1.5 rounded-full" style={{ background:C.violet, color:"white" }}>Compare</button>
          <button onClick={()=>setCompareIds([])} style={{ color:C.faint }}><Icon.x size={14} /></button>
        </div>
      )}

      {selectedTool && <ToolDetail tool={selectedTool} onClose={closeTool} saved={savedIds.has(selectedTool.id)} onToggleSave={toggleSave} onOpenCollections={(t)=>{ if(!session) return openAuth(); setPickerTool(t); }} session={session} headers={headers} />}
      {authOpen && <AuthModal onClose={closeAuth} onSignIn={signIn} onSignUp={signUp} />}
      {pickerTool && <CollectionPicker tool={pickerTool} collections={collections} onToggle={toggleInCollection} onCreate={(name)=>createCollection(name)} onClose={()=>{setPickerTool(null); setCollectionError("");}} error={collectionError} />}

      <footer className="py-6" style={{ borderTop:`1px solid ${C.cardBorder}` }}>
        <div className="max-w-3xl mx-auto px-5 text-xs flex items-center justify-between" style={{ color:C.faint }}>
          <span>Rynova AI — demo build, seed data</span>
          <span>Live Supabase project</span>
        </div>
      </footer>
    </div>
    </React.Fragment>
  );
}

try {
  ReactDOM.createRoot(document.getElementById("root")).render(<RynovaApp />);
} catch (e) {
  document.getElementById("root").innerHTML =
    '<div style="padding:24px;color:#FCA5A5;font-family:monospace;font-size:13px;white-space:pre-wrap;">RENDER ERROR: ' + (e && e.message) + '</div>';
}
</script>
</body>
</html>
