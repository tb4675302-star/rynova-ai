/* ---------------------------------------------------------
   RYNOVA AI — single-file build, wired to a real Supabase
   project (REST + Auth API, no SDK / build step needed).
   Session lives in memory only — refreshing the page logs
   you out. Swap in supabase-js with persistSession for a
   full production deploy.
--------------------------------------------------------- */

const SUPABASE_URL = "https://quabufcifiushxpxudnf.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_lqVunSZ6hq86RQdJi1UwNA_xrXfZeDc";
const REST = `${SUPABASE_URL}/rest/v1`;
const AUTH = `${SUPABASE_URL}/auth/v1`;

function useSupabase() {
  const [session, setSession] = useState(null);

  const headers = (json = true) => {
    const h = { apikey: SUPABASE_ANON_KEY };
    h.Authorization = `Bearer ${session?.access_token || SUPABASE_ANON_KEY}`;
    if (json) h["Content-Type"] = "application/json";
    return h;
  };

  async function signUp(email, password) {
    const res = await fetch(`${AUTH}/signup`, {
      method: "POST",
      headers: headers(),
      body: JSON.stringify({ email, password }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data?.msg || data?.error_description || "Sign up failed");
    if (data.access_token) setSession({ access_token: data.access_token, user: data.user });
    return data;
  }

  async function signIn(email, password) {
    const res = await fetch(`${AUTH}/token?grant_type=password`, {
      method: "POST",
      headers: headers(),
      body: JSON.stringify({ email, password }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data?.error_description || data?.msg || "Login failed");
    setSession({ access_token: data.access_token, user: data.user });
    return data;
  }

  function signOut() {
    setSession(null);
  }

  return { session, headers, signUp, signIn, signOut };
}

/* ---------------- Match scoring (deterministic, not random) ---------------- */
function scoreTool(tool, query) {
  if (!query.trim()) return null;
  const q = query.toLowerCase();
  const terms = q.split(/\s+/).filter((t) => t.length > 2);
  if (terms.length === 0) return null;

  const haystacks = [
    { text: tool.name?.toLowerCase() || "", weight: 3 },
    { text: tool.short_description?.toLowerCase() || "", weight: 2 },
    { text: tool.long_description?.toLowerCase() || "", weight: 1 },
    { text: (tool.use_cases || []).join(" ").toLowerCase(), weight: 3 },
    { text: (tool.features || []).join(" ").toLowerCase(), weight: 2 },
    { text: tool.categories?.name?.toLowerCase() || "", weight: 2 },
    { text: tool.best_for?.toLowerCase() || "", weight: 2 },
  ];

  let hits = 0;
  const maxHits = terms.length * haystacks.reduce((a, h) => a + h.weight, 0);
  for (const term of terms) {
    for (const h of haystacks) {
      if (h.text.includes(term)) hits += h.weight;
    }
  }
  if (hits === 0) return null;
  const coverage = Math.min(1, hits / (maxHits * 0.25));
  const qualityBoost = (tool.rating / 5) * 0.15 + (tool.popularity_score / 100) * 0.1;
  const raw = coverage * 0.75 + qualityBoost;
  return Math.max(52, Math.min(99, Math.round(raw * 100)));
}

function reasonFor(tool, query) {
  const terms = query.toLowerCase().split(/\s+/).filter((t) => t.length > 2);
  const matchedUseCases = (tool.use_cases || []).filter((u) => terms.some((t) => u.toLowerCase().includes(t)));
  const matchedFeatures = (tool.features || []).filter((f) => terms.some((t) => f.toLowerCase().includes(t)));
  if (matchedUseCases.length) return `Matches your need for ${matchedUseCases.slice(0, 2).join(" and ").toLowerCase()}.`;
  if (matchedFeatures.length) return `Stands out for ${matchedFeatures.slice(0, 2).join(" and ").toLowerCase()}.`;
  return `Strong overall fit for this category.`;
}

function AuthModal({ onClose, onSignIn, onSignUp }) {
  const [mode, setMode] = useState("signin");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);
  const [success, setSuccess] = useState("");

  async function submit(e) {
    e.preventDefault();
    setError(""); setSuccess("");
    if (!email.includes("@")) return setError("Enter a valid email address.");
    if (password.length < 6) return setError("Password must be at least 6 characters.");
    setLoading(true);
    try {
      if (mode === "signin") { await onSignIn(email, password); onClose(); }
      else {
        const data = await onSignUp(email, password);
        if (data?.access_token) onClose();
        else setSuccess("Account created — check your email to confirm before signing in.");
      }
    } catch (err) { setError(err.message); }
    finally { setLoading(false); }
  }

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-6" onClick={onClose} style={{backdropFilter:"blur(4px)"}}>
      <div className="w-full max-w-sm rounded-3xl p-6" style={{ background:C.card, border:`1px solid ${C.cardBorder}` }} onClick={(e)=>e.stopPropagation()}>
        <div className="flex items-center justify-between mb-6">
          <h2 className="font-semibold text-lg" style={{ color:C.text, fontFamily:"'Space Grotesk', sans-serif" }}>{mode === "signin" ? "Log in" : "Create account"}</h2>
          <button onClick={onClose} className="p-1.5 rounded-full" style={{ color:C.sub }}><Icon.x size={16} /></button>
        </div>
        <form onSubmit={submit} className="flex flex-col gap-3">
          <input type="email" placeholder="Email" value={email} onChange={(e)=>setEmail(e.target.value)} className="rounded-xl px-4 py-3 text-sm outline-none" style={{ background:"#0F0F16", border:`1px solid ${C.cardBorder}`, color:C.text }} />
          <input type="password" placeholder="Password" value={password} onChange={(e)=>setPassword(e.target.value)} className="rounded-xl px-4 py-3 text-sm outline-none" style={{ background:"#0F0F16", border:`1px solid ${C.cardBorder}`, color:C.text }} />
          {error && <p className="text-xs flex items-center gap-1.5" style={{ color:"#FB7185" }}><Icon.alert /> {error}</p>}
          {success && <p className="text-xs" style={{ color:"#34D399" }}>{success}</p>}
          <button type="submit" disabled={loading} className="text-sm font-medium py-3 rounded-xl flex items-center justify-center gap-2 disabled:opacity-60" style={{ background:C.violet, color:"white" }}>
            {loading ? "Please wait..." : (mode === "signin" ? "Log in" : "Sign up")}
          </button>
        </form>
        <p className="text-xs text-center mt-4" style={{ color:C.faint }}>
          {mode === "signin" ? "New to Rynova?" : "Already have an account?"}{" "}
          <button className="font-medium" style={{ color:"#A78BFA" }} onClick={()=>{ setMode(mode==="signin"?"signup":"signin"); setError(""); setSuccess(""); }}>
            {mode === "signin" ? "Create an account" : "Log in"}
          </button>
        </p>
      </div>
    </div>
  );
}

        </div>
        <div className="flex items-center gap-2">
          <input value={name} onChange={(e)=>setName(e.target.value)} placeholder="New collection name" className="flex-1 min-w-0 rounded-xl px-3 py-2.5 text-sm outline-none" style={{ background:"#0F0F16", border:`1px solid ${C.cardBorder}`, color:C.text }} />
          <button onClick={()=>{ if(name.trim()){ onCreate(name); setName(""); } }} className="text-sm font-medium px-4 py-2.5 rounded-xl shrink-0" style={{ background:C.violet, color:"white" }}>Create</button>
        </div>
        {error && <p className="text-xs mt-2 flex items-center gap-1.5" style={{ color:"#FB7185" }}><Icon.alert /> {error}</p>}
      </div>
    </div>
  );
}

const suggestionChips = [
  { emoji: "🖼️", label: "Remove image background" },
  { emoji: "🎨", label: "Generate AI art" },
  { emoji: "💻", label: "Write code faster" },
  { emoji: "🎙️", label: "Create voiceovers" },
  { emoji: "🎵", label: "Make AI music" },
  { emoji: "📄", label: "Summarize documents" },
];

function RynovaApp() {
  const { session, headers, signUp, signIn, signOut } = useSupabase();
  const [categories, setCategories] = useState([]);
  const [tools, setTools] = useState([]);
  const [savedIds, setSavedIds] = useState(new Set());
  const [collections, setCollections] = useState([]);
  const [dashboardTab, setDashboardTab] = useState("saved");
  const [openCollectionId, setOpenCollectionId] = useState(null);
  const [newCollectionName, setNewCollectionName] = useState("");
  const [pickerTool, setPickerTool] = useState(null);
  const [collectionError, setCollectionError] = useState("");
  const [loading, setLoading] = useState(true);
  const [loadError, setLoadError] = useState("");
  const [query, setQuery] = useState("");
  const [submittedQuery, setSubmittedQuery] = useState("");
  const [pricingTab, setPricingTab] = useState("all");
  const [view, setView] = useState("home");
  const [selectedTool, setSelectedTool] = useState(null);
  const [authOpen, setAuthOpen] = useState(false);
  const [recentIds, setRecentIds] = useState([]);

  useEffect(() => {
    window.history.replaceState({ view: "home", modal: null }, "");
    function onPop(e) {
      const s = e.state || { view: "home", modal: null };
      setView(s.view || "home");
      setSelectedTool(s.modal === "tool" ? (tools.find(t => t.id === s.toolId) || null) : null);
      setAuthOpen(s.modal === "auth");
    }
    window.addEventListener("popstate", onPop);
    return () => window.removeEventListener("popstate", onPop);
  }, [tools]);

  function goTo(nextView) {
    window.history.pushState({ view: nextView, modal: null }, "");
    setView(nextView);
  }
  function openAuth() {
    window.history.pushState({ view, modal: "auth" }, "");
    setAuthOpen(true);
  }
  function closeAuth() { window.history.back(); }
  function closeTool() { window.history.back(); }

  useEffect(() => {
    async function load() {
      setLoading(true); setLoadError("");
      try {
        const [catRes, toolRes] = await Promise.all([
          fetch(`${REST}/categories?select=*&order=name.asc`, { headers: headers() }),
          fetch(`${REST}/tools?select=*,categories(name,slug,icon)&status=eq.approved`, { headers: headers() }),
        ]);
        if (!catRes.ok || !toolRes.ok) throw new Error("Could not load data from Supabase.");
        setCategories(await catRes.json());
        const rawTools = await toolRes.json();
        const deduped = Array.from(new Map(rawTools.map(t => [t.name.trim().toLowerCase(), t])).values());
        setTools(deduped);
      } catch (err) { setLoadError(err.message); }
      finally { setLoading(false); }
    }
    load();
  }, []);

  useEffect(() => {
    async function loadSaved() {
      if (!session) return setSavedIds(new Set());
      try {
        const res = await fetch(`${REST}/saved_tools?select=tool_id&user_id=eq.${session.user.id}`, { headers: headers() });
        const data = await res.json();
        setSavedIds(new Set(data.map((d) => d.tool_id)));
      } catch {}
    }
    loadSaved();
    loadCollections();
  }, [session]);

  async function loadCollections() {
    if (!session) return setCollections([]);
    try {
      const res = await fetch(`${REST}/collections?select=*,collection_tools(tool_id)&user_id=eq.${session.user.id}&order=created_at.asc`, { headers: headers() });
      const data = await res.json();
      setCollections(data);
    } catch {}
  }

  async function createCollection(name) {
    if (!session || !name.trim()) return;
    setCollectionError("");
    try {
      const res = await fetch(`${REST}/collections`, {
        method: "POST",
        headers: { ...headers(), Prefer: "return=representation" },
        body: JSON.stringify({ user_id: session.user.id, name: name.trim() }),
      });
      const data = await res.json();
      if (!res.ok) {
        setCollectionError(data?.message || data?.hint || "Could not create collection.");
        return;
      }
      setCollections((prev) => [...prev, { ...data[0], collection_tools: [] }]);
      setNewCollectionName("");
    } catch (err) {
      setCollectionError(err.message || "Network error while creating collection.");
    }
  }

  async function deleteCollection(id) {
    setCollections((prev) => prev.filter((c) => c.id !== id));
    if (openCollectionId === id) setOpenCollectionId(null);
    try {
      await fetch(`${REST}/collections?id=eq.${id}`, { method: "DELETE", headers: headers() });
    } catch {}
  }

  async function toggleInCollection(collectionId, toolId) {
    const col = collections.find((c) => c.id === collectionId);
    const isIn = col?.collection_tools?.some((ct) => ct.tool_id === toolId);
    setCollections((prev) => prev.map((c) => {
      if (c.id !== collectionId) return c;
      return {
        ...c,
        collection_tools: isIn
          ? c.collection_tools.filter((ct) => ct.tool_id !== toolId)
          : [...c.collection_tools, { tool_id: toolId }],
      };
    }));
    try {
      if (isIn) {
        await fetch(`${REST}/collection_tools?collection_id=eq.${collectionId}&tool_id=eq.${toolId}`, { method: "DELETE", headers: headers() });
      } else {
        await fetch(`${REST}/collection_tools`, {
          method: "POST",
          headers: { ...headers(), Prefer: "return=minimal" },
          body: JSON.stringify({ collection_id: collectionId, tool_id: toolId }),
        });
      }
    } catch {}
  }

  async function toggleSave(tool) {
    if (!session) return openAuth();
    const isSaved = savedIds.has(tool.id);
    const next = new Set(savedIds);
    try {
      if (isSaved) {
        next.delete(tool.id); setSavedIds(next);
        await fetch(`${REST}/saved_tools?user_id=eq.${session.user.id}&tool_id=eq.${tool.id}`, { method:"DELETE", headers: headers() });
      } else {
        next.add(tool.id); setSavedIds(next);
        await fetch(`${REST}/saved_tools`, { method:"POST", headers:{...headers(), Prefer:"return=minimal"}, body: JSON.stringify({ user_id: session.user.id, tool_id: tool.id }) });
      }
    } catch { setSavedIds(savedIds); }
  }

  function openTool(tool) {
    window.history.pushState({ view, modal: "tool", toolId: tool.id }, "");
    setSelectedTool(tool);
    setRecentIds((prev) => [tool.id, ...prev.filter((id) => id !== tool.id)].slice(0,5));
  }

  async function runSearch(q) {
    setSubmittedQuery(q); goTo("discover");
    if (session && q.trim()) {
      try { await fetch(`${REST}/search_history`, { method:"POST", headers:{...headers(), Prefer:"return=minimal"}, body: JSON.stringify({ user_id: session.user.id, query: q }) }); } catch {}
    }
  }

  const featuredTool = useMemo(() => [...tools].sort((a,b)=>b.popularity_score-a.popularity_score)[0], [tools]);
  const categoryCounts = useMemo(() => { const m={}; tools.forEach(t=>{ const s=t.categories?.slug; if(s) m[s]=(m[s]||0)+1; }); return m; }, [tools]);
  const trendingList = useMemo(() => { let l = tools.filter(t=>t.trending||t.popularity_score>=85); if(pricingTab!=="all") l=l.filter(t=>t.pricing_type===pricingTab); return l.sort((a,b)=>b.popularity_score-a.popularity_score); }, [tools, pricingTab]);
  const newReleases = useMemo(() => {
    const unique = Array.from(new Map(tools.map(t => [t.id, t])).values());
    return unique.sort((a,b) => {
      const diff = new Date(b.created_at) - new Date(a.created_at);
      return diff !== 0 ? diff : a.name.localeCompare(b.name);
    }).slice(0,5);
  }, [tools]);
  const recentTools = useMemo(() => recentIds.map(id=>tools.find(t=>t.id===id)).filter(Boolean), [recentIds, tools]);
  const searchResults = useMemo(() => { if(!submittedQuery.trim()) return []; return tools.map(t=>({...t,_score:scoreTool(t,submittedQuery)})).filter(t=>t._score!==null).sort((a,b)=>b._score-a._score); }, [tools, submittedQuery]);

  return (
    <div className="min-h-screen" style={{ background:C.bg, color:C.text, fontFamily:"'Inter', sans-serif" }}>
      <nav className="sticky top-0 z-40" style={{ background:"rgba(10,10,15,0.9)", borderBottom:`1px solid ${C.cardBorder}` }}>
        <div className="max-w-3xl mx-auto px-5 h-16 flex items-center justify-between">
          <button onClick={()=>goTo("home")} className="font-semibold text-lg tracking-tight" style={{ color:C.text, fontFamily:"'Space Grotesk', sans-serif" }}>Rynova</button>
          {session ? (
            <div className="flex items-center gap-2">
              <button onClick={()=>goTo("dashboard")} className="text-sm font-medium px-4 py-2 rounded-full" style={{ border:`1px solid ${C.cardBorder}`, color:C.text }}>Saved</button>
              <button onClick={signOut} className="text-sm font-medium px-4 py-2 rounded-full" style={{ border:`1px solid ${C.cardBorder}`, color:C.text }}>Log out</button>
            </div>
          ) : (
            <button onClick={openAuth} className="text-sm font-medium px-4 py-2 rounded-full flex items-center gap-1.5" style={{ background:C.violet, color:"white" }}><Icon.login /> Log in</button>
          )}
        </div>
      </nav>

      {loadError && (
        <div className="max-w-3xl mx-auto px-5 mt-4">
          <div className="text-sm rounded-xl px-4 py-3 flex items-center gap-2" style={{ background:"rgba(251,113,133,0.1)", border:"1px solid rgba(251,113,133,0.3)", color:"#FB7185" }}><Icon.alert /> {loadError}</div>
        </div>
      )}

      <div className="max-w-3xl mx-auto px-5 pb-20">
        {view === "home" && (
          <React.Fragment>
            <section className="pt-8 pb-8">
              <div className="inline-flex items-center gap-1.5 text-xs font-medium px-3 py-1.5 rounded-full mb-5" style={{ background:C.violetSoft, color:"#C4B5FD" }}><Icon.spark /> {tools.length || "—"} AI tools indexed and growing</div>
              <h1 className="text-3xl sm:text-4xl font-semibold leading-[1.15] tracking-tight" style={{ fontFamily:"'Space Grotesk', sans-serif" }}>
                Find the perfect AI tool<br/>
                <span style={{ background:"linear-gradient(90deg, #A78BFA, #60A5FA)", WebkitBackgroundClip:"text", WebkitTextFillColor:"transparent" }}>for any problem</span>
              </h1>
              <p className="text-sm mt-4 leading-relaxed" style={{ color:C.sub }}>Describe your problem in plain English. We'll match you with the best AI tools — ranked by relevance, rated by real users.</p>
              <form onSubmit={(e)=>{e.preventDefault(); if(query.trim()) runSearch(query);}} className="mt-5 flex items-center gap-2 rounded-2xl p-2" style={{ background:C.card, border:`1px solid ${C.cardBorder}` }}>
                <span className="ml-2 shrink-0" style={{ color:C.faint }}><Icon.search /></span>
                <input value={query} onChange={(e)=>setQuery(e.target.value)} placeholder="I want an AI that edits..." className="flex-1 outline-none text-sm py-2 bg-transparent min-w-0" style={{ color:C.text }} />
                <button type="submit" className="text-sm font-medium px-4 py-2 rounded-xl shrink-0" style={{ background:C.violet, color:"white" }}>Search</button>
              </form>
              <div className="flex flex-wrap gap-2 mt-3">
                {suggestionChips.map(({emoji,label})=>(
                  <button key={label} onClick={()=>{setQuery(label); runSearch(label);}} className="text-xs flex items-center gap-1.5 px-3 py-1.5 rounded-full" style={{ border:`1px solid ${C.cardBorder}`, color:C.sub }}>
                    <span>{emoji}</span> {label}
                  </button>
                ))}
              </div>
            </section>

            <section className="pb-8">
              <h2 className="text-sm font-semibold mb-1" style={{ color:C.text }}>Browse Categories</h2>
              <p className="text-xs mb-3" style={{ color:C.faint }}>{categories.length} categories covering every use case</p>
              <div className="grid grid-cols-2 gap-2">
                {loading ? Array.from({length:6}).map((_,i)=>(<div key={i} className="h-16 rounded-2xl animate-pulse" style={{ background:C.card }} />))
                : categories.map(c=>(
                  <button key={c.id} onClick={()=>{setSubmittedQuery(""); goTo("discover");}} className="rounded-2xl p-3 text-left" style={{ background:C.card, border:`1px solid ${C.cardBorder}` }}>
                    <p className="text-sm font-medium" style={{ color:C.text }}>{c.name}</p>
                    <p className="text-xs" style={{ color:C.faint }}>{categoryCounts[c.slug]||0} tools</p>
                  </button>
                ))}
              </div>
            </section>

            {!loading && featuredTool && (
              <section className="pb-8">
                <h2 className="text-sm font-semibold mb-3 flex items-center gap-1.5" style={{ color:C.text }}><span style={{color:C.violet}}><Icon.spark /></span> Featured Today</h2>
                <FeaturedCard tool={featuredTool} saved={savedIds.has(featuredTool.id)} onToggleSave={toggleSave} onOpen={openTool} />
              </section>
            )}

            <section className="pb-8">
              <div className="flex items-center justify-between mb-3">
                <h2 className="text-sm font-semibold" style={{ color:C.text }}>Trending This Week</h2>
                <span className="text-xs" style={{ color:C.faint }}>{trendingList.length} tools</span>
              </div>
              <div className="flex gap-2 mb-3">
                {["all","free","freemium","paid"].map(p=>(
                  <button key={p} onClick={()=>setPricingTab(p)} className="text-xs font-medium px-3 py-1.5 rounded-full capitalize" style={pricingTab===p?{background:C.violet,color:"white"}:{border:`1px solid ${C.cardBorder}`,color:C.sub}}>{p}</button>
                ))}
              </div>
              <div className="flex flex-col gap-3">
                {loading ? Array.from({length:3}).map((_,i)=>(<div key={i} className="h-40 rounded-2xl animate-pulse" style={{ background:C.card }} />))
                : trendingList.map(t=>(<ToolRow key={t.id} tool={t} query="" saved={savedIds.has(t.id)} onToggleSave={toggleSave} onOpen={openTool} />))}
              </div>
            </section>

            <section className="pb-8">
              <div className="flex items-center justify-between mb-3">
                <h2 className="text-sm font-semibold" style={{ color:C.text }}>New Releases</h2>
                <Pill style={{ background:"rgba(52,211,153,0.14)", color:"#34D399" }}>Updated Today</Pill>
              </div>
              <div className="flex flex-col gap-3">
                {newReleases.map(t=>(<ToolRow key={t.id} tool={t} query="" saved={savedIds.has(t.id)} onToggleSave={toggleSave} onOpen={openTool} />))}
              </div>
            </section>

            {recentTools.length > 0 && (
              <section>
                <h2 className="text-sm font-semibold mb-3" style={{ color:C.text }}>Recently Viewed</h2>
                <div className="flex flex-col gap-2">
                  {recentTools.map(t=>(
                    <button key={t.id} onClick={()=>openTool(t)} className="flex items-center gap-3 rounded-xl p-3 text-left w-full" style={{ background:C.card, border:`1px solid ${C.cardBorder}` }}>
                      <Logo name={t.name} size={32} />
                      <div className="min-w-0 flex-1">
                        <p className="text-sm font-medium truncate" style={{ color:C.text }}>{t.name}</p>
                        <p className="text-xs" style={{ color:C.faint }}>{t.categories?.name}</p>
                      </div>
                      <span className="flex items-center gap-1 text-xs" style={{ color:C.sub }}><Icon.star size={11} /> {t.rating}</span>
                      <span style={{color:C.faint}}><Icon.chevron /></span>
                    </button>
                  ))}
                </div>
              </section>
            )}
          </React.Fragment>
        )}

        {view === "discover" && (
          <section className="pt-8">
            <div className="flex items-center gap-2 rounded-2xl p-2 mb-4" style={{ background:C.card, border:`1px solid ${C.cardBorder}` }}>
              <span className="ml-2 shrink-0" style={{ color:C.faint }}><Icon.search /></span>
              <input value={query} onChange={(e)=>setQuery(e.target.value)} onKeyDown={(e)=>e.key==="Enter"&&runSearch(query)} placeholder="Describe what you want to do with AI..." className="flex-1 outline-none text-sm py-2 bg-transparent min-w-0" style={{ color:C.text }} />
              <button onClick={()=>runSearch(query)} className="text-sm font-medium px-4 py-2 rounded-xl shrink-0" style={{ background:C.violet, color:"white" }}>Search</button>
            </div>
            <button onClick={()=>goTo("home")} className="text-xs mb-4" style={{ color:C.faint }}>← Back to home</button>
            {loading ? (
              <div className="flex flex-col gap-3">{Array.from({length:4}).map((_,i)=>(<div key={i} className="h-40 rounded-2xl animate-pulse" style={{ background:C.card }} />))}</div>
            ) : submittedQuery.trim() ? (
              searchResults.length === 0 ? (
                <div className="text-center py-16"><p className="font-medium mb-1" style={{ color:C.text }}>No tools match this yet.</p><p className="text-sm" style={{ color:C.faint }}>Try a different phrase.</p></div>
              ) : (
                <div className="flex flex-col gap-3">{searchResults.map(t=>(<ToolRow key={t.id} tool={t} query={submittedQuery} saved={savedIds.has(t.id)} onToggleSave={toggleSave} onOpen={openTool} />))}</div>
              )
            ) : (
              <div className="flex flex-col gap-3">{tools.sort((a,b)=>b.popularity_score-a.popularity_score).map(t=>(<ToolRow key={t.id} tool={t} query="" saved={savedIds.has(t.id)} onToggleSave={toggleSave} onOpen={openTool} />))}</div>
            )}
          </section>
        )}

        {view === "dashboard" && (
          <section className="pt-8">
            <h1 className="text-2xl font-semibold mb-1" style={{ color:C.text, fontFamily:"'Space Grotesk', sans-serif" }}>Your library</h1>
            <button onClick={()=>goTo("home")} className="text-xs mb-4 block" style={{ color:C.faint }}>← Back to home</button>
            {!session ? (
              <div className="text-center py-16">
                <p className="font-medium mb-1" style={{ color:C.text }}>Log in to see your saved tools and collections.</p>
                <button onClick={openAuth} className="text-sm font-medium px-4 py-2 rounded-full mt-3" style={{ background:C.violet, color:"white" }}>Log in</button>
              </div>
            ) : (
              <React.Fragment>
                <div className="flex gap-2 mb-5">
                  <button onClick={()=>{setDashboardTab("saved"); setOpenCollectionId(null);}} className="text-sm font-medium px-4 py-2 rounded-full" style={dashboardTab==="saved"?{background:C.violet,color:"white"}:{border:`1px solid ${C.cardBorder}`,color:C.sub}}>Saved Tools</button>
                  <button onClick={()=>{setDashboardTab("collections"); setOpenCollectionId(null);}} className="text-sm font-medium px-4 py-2 rounded-full" style={dashboardTab==="collections"?{background:C.violet,color:"white"}:{border:`1px solid ${C.cardBorder}`,color:C.sub}}>Collections</button>
                </div>

                {dashboardTab === "saved" && (
                  savedIds.size === 0 ? (
                    <div className="text-center py-16">
                      <p className="font-medium mb-1" style={{ color:C.text }}>No saved tools yet.</p>
                      <p className="text-sm" style={{ color:C.faint }}>Tap the bookmark icon on any tool to save it here.</p>
                    </div>
                  ) : (
                    <div className="flex flex-col gap-3">
                      {tools.filter(t => savedIds.has(t.id)).map(t => (
                        <ToolRow key={t.id} tool={t} query="" saved={true} onToggleSave={toggleSave} onOpen={openTool} />
                      ))}
                    </div>
                  )
                )}

                {dashboardTab === "collections" && !openCollectionId && (
                  <React.Fragment>
                    <div className="flex items-center gap-2 mb-2">
                      <input value={newCollectionName} onChange={(e)=>setNewCollectionName(e.target.value)} placeholder="New collection name (e.g. Content Creator Stack)" className="flex-1 min-w-0 rounded-xl px-3 py-2.5 text-sm outline-none" style={{ background:C.card, border:`1px solid ${C.cardBorder}`, color:C.text }} />
                      <button onClick={()=>createCollection(newCollectionName)} className="text-sm font-medium px-4 py-2.5 rounded-xl shrink-0" style={{ background:C.violet, color:"white" }}>Create</button>
                    </div>
                    {collectionError && <p className="text-xs mb-3 flex items-center gap-1.5" style={{ color:"#FB7185" }}><Icon.alert /> {collectionError}</p>}
                    {collections.length === 0 ? (
                      <div className="text-center py-16">
                        <p className="font-medium mb-1" style={{ color:C.text }}>No collections yet.</p>
                        <p className="text-sm" style={{ color:C.faint }}>Create one above, or use "+ Collection" on any tool.</p>
                      </div>
                    ) : (
                      <div className="flex flex-col gap-3">
                        {collections.map((c) => (
                          <div key={c.id} className="rounded-2xl p-4 flex items-center justify-between" style={{ background:C.card, border:`1px solid ${C.cardBorder}` }}>
                            <button onClick={()=>setOpenCollectionId(c.id)} className="text-left flex-1">
                              <p className="font-medium" style={{ color:C.text }}>{c.name}</p>
                              <p className="text-xs" style={{ color:C.faint }}>{(c.collection_tools||[]).length} tool{(c.collection_tools||[]).length===1?"":"s"}</p>
                            </button>
                            <button onClick={()=>deleteCollection(c.id)} className="p-2 rounded-full" style={{ color:C.faint }}><Icon.x size={16} /></button>
                          </div>
                        ))}
                      </div>
                    )}
                  </React.Fragment>
                )}

                {dashboardTab === "collections" && openCollectionId && (
                  <React.Fragment>
                    <button onClick={()=>setOpenCollectionId(null)} className="text-xs mb-4 block" style={{ color:C.faint }}>← Back to collections</button>
                    {(() => {
                      const col = collections.find(c => c.id === openCollectionId);
                      const ids = new Set((col?.collection_tools||[]).map(ct => ct.tool_id));
                      const colTools = tools.filter(t => ids.has(t.id));
                      return (
                        <React.Fragment>
                          <h2 className="text-lg font-semibold mb-4" style={{ color:C.text, fontFamily:"'Space Grotesk', sans-serif" }}>{col?.name}</h2>
                          {colTools.length === 0 ? (
                            <div className="text-center py-16">
                              <p className="font-medium mb-1" style={{ color:C.text }}>No tools in this collection yet.</p>
                              <p className="text-sm" style={{ color:C.faint }}>Use "+ Collection" on any tool to add it here.</p>
                            </div>
                          ) : (
                            <div className="flex flex-col gap-3">
                              {colTools.map(t => (
                                <ToolRow key={t.id} tool={t} query="" saved={savedIds.has(t.id)} onToggleSave={toggleSave} onOpen={openTool} />
                              ))}
                            </div>
                          )}
                        </React.Fragment>
                      );
                    })()}
                  </React.Fragment>
                )}
              </React.Fragment>
            )}
          </section>
        )}
      </div>

      {selectedTool && <ToolDetail tool={selectedTool} onClose={closeTool} saved={savedIds.has(selectedTool.id)} onToggleSave={toggleSave} onOpenCollections={(t)=>{ if(!session) return openAuth(); setPickerTool(t); }} />}
      {authOpen && <AuthModal onClose={closeAuth} onSignIn={signIn} onSignUp={signUp} />}
      {pickerTool && <CollectionPicker tool={pickerTool} collections={collections} onToggle={toggleInCollection} onCreate={(name)=>createCollection(name)} onClose={()=>{setPickerTool(null); setCollectionError("");}} error={collectionError} />}

      <footer className="py-6" style={{ borderTop:`1px solid ${C.cardBorder}` }}>
        <div className="max-w-3xl mx-auto px-5 text-xs flex items-center justify-between" style={{ color:C.faint }}>
          <span>Rynova AI — demo build, seed data</span>
          <span>Live Supabase project</span>
        </div>
      </footer>
    </div>
  );
}

try {
  ReactDOM.createRoot(document.getElementById("root")).render(<RynovaApp />);
} catch (e) {
  document.getElementById("root").innerHTML =
    '<div style="padding:24px;color:#FCA5A5;font-family:monospace;font-size:13px;white-space:pre-wrap;">RENDER ERROR: ' + (e && e.message) + '</div>';
}
</script>
</body>
</html>
